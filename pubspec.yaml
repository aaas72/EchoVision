name: echovision
description: "EchoVision (YankıGörüş) - Zero-UI AI Assistant for the Visually Impaired"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  tflite_flutter: ^0.12.0
  image: ^4.2.0
  flutter_tts: ^4.2.0
  vibration: ^2.0.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1
  http: ^1.2.0
  path_provider: ^2.1.5
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.2.1
  speech_to_text: ^7.4.0
  battery_plus: ^6.1.1
  vosk_flutter_2: ^1.0.5
  archive: ^3.6.1
  google_mlkit_text_recognition: ^0.14.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/          # YOLOv11n (object detection) + lira.tflite (currency v2, YOLOv11n-cls, 97.2%)
    - assets/sounds/          # UI interaction earcons
